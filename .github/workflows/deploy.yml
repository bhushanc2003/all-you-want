name: Deploy All You Want Web App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Required for requesting the OIDC JWT Token from GitHub
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Provision Infrastructure & Deploy App via OIDC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # STEP 1: Authenticate with AWS using OIDC (OpenID Connect)
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::840271451118:role/GitHubActions-AllYouWant-Role
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      # -----------------------------------------------------------------------
      # STEP 2: Provision AWS Infrastructure via Terraform (S3 & CloudFront)
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init & Apply Resources
        id: terraform
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

          # Extract Outputs for deployment
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          CLOUDFRONT_DIST_ID=$(terraform output -raw cloudfront_distribution_id)

          echo "S3_BUCKET_NAME=$S3_BUCKET" >> $GITHUB_ENV
          echo "CLOUDFRONT_DIST_ID=$CLOUDFRONT_DIST_ID" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # STEP 3: Build React Frontend App
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies & Build Frontend
        run: |
          cd app
          npm ci
          npm run build

      # -----------------------------------------------------------------------
      # STEP 4: Sync Build Artifacts to S3 & Invalidate CloudFront CDN
      # -----------------------------------------------------------------------
      - name: Sync Static Assets to S3
        run: |
          aws s3 sync app/dist/ s3://${{ env.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront CDN Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} --paths "/*"
